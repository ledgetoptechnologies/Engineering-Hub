[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hub-staging-assets"
version = "0.1.2"
description = "Native read-only immutable asset transport for Engineering Hub"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
hub-staging-assets = "hub_staging_assets.__main__:main"

[tool.setuptools]
package-dir = {"" = "../../src"}
packages = ["hub_staging_assets"]
