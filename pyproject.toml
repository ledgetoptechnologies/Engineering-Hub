[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-message-bus"
version = "0.6.0"
description = "Authenticated shared message and knowledge bus for Hermes, Codex, and Claude Code"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=50.0.2,<51",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "mcp>=1.30,<1.31",
  "pydantic>=2.7,<3",
  "python-multipart>=0.0.9,<1",
  "fastembed>=0.9,<1",
  "httpx>=0.27,<1",
  "PyJWT[crypto]>=2.15.1,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "httpx>=0.27,<1",
]

[tool.setuptools.package-data]
agent_message_bus = ["schema.sql", "feedback_schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
default-groups = ["test"]

[dependency-groups]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "httpx>=0.27,<1",
]
