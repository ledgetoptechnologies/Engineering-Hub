name: Verify published package
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        default: '0.6.0'
      revision:
        required: true
permissions:
  contents: read
  packages: read
jobs:
  verify-package:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read back immutable release and stable
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED_REVISION: ${{ inputs.revision }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_REVISION" =~ ^[a-f0-9]{40}$ ]]
          for tag in "$VERSION" stable; do
            image="ghcr.io/ledgetoptechnologies/internal-mcp:$tag"
            docker pull "$image"
            actual=$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
            test "$actual" = "$EXPECTED_REVISION"
            docker image inspect "$image" --format '{{json .RepoDigests}}' > "$tag-digest.json"
            docker run --rm --network none --read-only --user 568:568 --entrypoint python -e EXPECTED_VERSION="$VERSION" "$image" -c "import os; from importlib.metadata import version; assert version('agent-message-bus') == os.environ['EXPECTED_VERSION']; from fastembed import TextEmbedding; model=TextEmbedding(model_name='BAAI/bge-small-en-v1.5',cache_dir='/opt/fastembed-cache',local_files_only=True,providers=['CPUExecutionProvider'],threads=2); assert len(list(model.embed(['semantic package verification']))[0])==384; print('Package and offline model verified')"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: published-image-verification
          path: '*-digest.json'
