name: Hub control preparation artifact
on:
  push:
    branches: [work/hub-control-artifact-hermes]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SOURCE: 4f3e15d6cbd2aa64d6d907d72ec2fcdf1645779d
      IMAGE: ghcr.io/ledgetoptechnologies/engineering-hub-control:sha-4f3e15d6cbd2aa64d6d907d72ec2fcdf1645779d
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4f3e15d6cbd2aa64d6d907d72ec2fcdf1645779d
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.hub-control
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          build-args: VCS_REF=${{ env.SOURCE }}
      - name: Verify first boot with isolated named volume
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name hub-artifact-smoke --network none --read-only --user 10001:10001 --cap-drop ALL --security-opt no-new-privileges:true --memory 512m --pids-limit 128 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777 --mount type=volume,source=hub-artifact-smoke-state,target=/var/lib/hub -e HUB_BASE_URL=https://hub.ledgetoptechnologies.com -e HERMES_TOKEN=synthetic-ci-hermes-only -e CODEX_TOKEN=synthetic-ci-codex-only -e CLAUDE_TOKEN=synthetic-ci-claude-only "$IMAGE"
          ready=0
          for attempt in $(seq 1 30); do
            if docker exec hub-artifact-smoke python -c "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8770/health',timeout=2)); assert d.get('ok') is True"; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          docker exec hub-artifact-smoke python -c "import importlib.resources as r,json,os,pathlib; assert os.getuid()==10001; assert pathlib.Path('/var/lib/hub/hub.sqlite3').is_file(); d=json.loads(r.files('engineering_hub').joinpath('_build_identity.json').read_text()); assert d['build_commit']=='4f3e15d6cbd2aa64d6d907d72ec2fcdf1645779d'"
          docker rm -f hub-artifact-smoke
          docker volume rm hub-artifact-smoke-state
      - name: Publish immutable source artifact
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' > hub-control-registry-manifest.json
          printf '%s\n' "$SOURCE" > hub-control-source.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hub-control-image-evidence
          path: |
            hub-control-registry-manifest.json
            hub-control-source.txt
