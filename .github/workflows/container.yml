name: Standalone bus container validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/container.yml'
      - '.dockerignore'
      - '.env.example'
      - 'Dockerfile'
      - 'compose.yaml'
      - 'compose.truenas.yaml'
      - 'docker/entrypoint.sh'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'README.md'
      - 'src/**'

permissions:
  contents: read

jobs:
  verify:
    name: Validate Compose and build container
    # Development branches and PRs are validated locally on staging.
    # The backend suite runs once per main push, in hub-control.yml's verify
    # job; repeating it here doubled the billed minutes.
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Compose files
        run: |
          cp .env.example .env
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.truenas.yaml config --quiet

      - name: Build container image
        run: docker build --tag agent-message-bus:ci --build-arg VERSION=ci .
