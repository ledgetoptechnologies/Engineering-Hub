services:
  agent-message-bus:
    build: .
    restart: unless-stopped
    user: "${AGENT_BUS_UID:-1000}:${AGENT_BUS_GID:-1000}"
    env_file:
      - .env
    ports:
      - "127.0.0.1:${AGENT_BUS_PORT:-8765}:${AGENT_BUS_PORT:-8765}"
    volumes:
      - ./data:/var/lib/agent-message-bus
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('AGENT_BUS_PORT','8765') + '/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
