services:
  agent-message-bus:
    build: .
    restart: unless-stopped
    user: "${AGENT_BUS_UID:-1000}:${AGENT_BUS_GID:-1000}"
    # Host networking preserves the real client IP for AGENT_BUS_ALLOWED_IPS.
    # The service still binds only to the host address configured in .env.
    network_mode: host
    env_file:
      - .env
    environment:
      # Keep artifacts on the persistent ./data bind mount even if an older
      # .env does not yet define the new setting.
      AGENT_BUS_FILE_ROOT: "${AGENT_BUS_FILE_ROOT:-/var/lib/agent-message-bus/files}"
    volumes:
      - ./data:/var/lib/agent-message-bus
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('AGENT_BUS_PORT','8765') + '/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
