# INERT EXAMPLE: include in a dedicated nginx http context only after all
# placeholders are replaced by reviewed operator values. Not an installer.
# A pre-nginx source-IP firewall and bounded TCP connection admission are
# prerequisites; nginx HTTP limits do not constrain incomplete handshakes.
map "$request_method:$request_uri" $eh_observer_allowed {
    default 0;
    "~^GET:/v1/runtime$" 1;
}

server {
    listen __STAGING_BIND_IP__:__TLS_PORT__ ssl;
    server_name __STAGING_BIND_IP__;
    ssl_certificate __CERTIFICATE_CHAIN_PATH__;
    ssl_certificate_key __CERTIFICATE_KEY_PATH__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    allow __APPROVED_NAS_IP__;
    deny all;
    access_log off;
    server_tokens off;
    client_header_timeout 5s;
    client_body_timeout 2s;
    client_max_body_size 1k;
    large_client_header_buffers 2 8k;
    keepalive_timeout 5s;
    send_timeout 10s;

    location / {
        if ($eh_observer_allowed = 0) { return 404; }
        if ($http_transfer_encoding != "") { return 400; }
        proxy_pass http://127.0.0.1:__OBSERVER_PORT__;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host localhost;
        proxy_set_header Connection close;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 4 4k;
        proxy_busy_buffers_size 8k;
        proxy_max_temp_file_size 0;
        proxy_cache off;
        proxy_store off;
        proxy_redirect off;
        proxy_intercept_errors off;
        proxy_ignore_headers X-Accel-Redirect X-Accel-Buffering;
        proxy_next_upstream off;
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 10s;
    }
}
