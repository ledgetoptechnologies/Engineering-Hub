# Requires the settings-file release. Configure settings.json and preserved bus
# state inside Engineering-Hub before startup; never delete the old source.
name: e-h-control
services:
  engineering-hub-control:
    image: ghcr.io/ledgetoptechnologies/engineering-hub-control:latest
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 1200s
    network_mode: host
    command: [--config, /var/lib/hub/settings.json]
    environment:
      HERMES_TOKEN: REPLACE_WITH_EXISTING_HERMES_TOKEN
      CODEX_TOKEN: REPLACE_WITH_EXISTING_CODEX_TOKEN
      CLAUDE_TOKEN: REPLACE_WITH_EXISTING_CLAUDE_TOKEN
      ADMIN_TOKEN: REPLACE_WITH_EXISTING_ADMIN_TOKEN
    volumes:
      - /mnt/Plugins/App_Data/Engineering-Hub:/var/lib/hub
    # Bound the control plane; these are not processing-worker resources.
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
